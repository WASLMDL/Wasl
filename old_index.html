<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WASL | وصل</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b14;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:440px;background:#141b2b;border:1px solid #29334a;border-radius:22px;padding:28px;box-shadow:0 15px 50px #0006}
.logo{text-align:center;font-size:38px;font-weight:bold;color:#8b5cf6;margin-bottom:8px}
.sub{text-align:center;color:#a2aec4;margin-bottom:25px}
h2{font-size:22px;text-align:center}
label{display:block;margin:16px 0 8px;color:#cbd5e1}
input,select{width:100%;padding:14px;border-radius:11px;border:1px solid #35415b;background:#0d1321;color:white;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#8b5cf6;color:white;font-size:17px;font-weight:bold;margin-top:20px;cursor:pointer}
button:disabled{opacity:.5}
.note{color:#94a3b8;font-size:13px;line-height:1.7;text-align:center;margin-top:18px}
#status{margin-top:15px;text-align:center;line-height:1.7;color:#fbbf24}
#profile{display:none;text-align:center}
</style>
</head>
<body>
<main class="card">
<div class="logo">WASL</div>
<div class="sub">مساحة تجمعنا • محادثات بلا حدود</div>

<section id="entry">
<h2>أهلاً بك في وصل 👋</h2>
<p class="sub">اختر اسمك ورمزك وابدأ رحلتك</p>

<label for="nickname">الاسم المستعار</label>
<input id="nickname" maxlength="30" placeholder="اكتب الاسم الذي سيظهر للآخرين">

<label for="loginName">رمز الدخول الذي تختاره</label>
<input id="loginName" maxlength="24" placeholder="4 إلى 24 حرفًا أو رقمًا">

<label for="language">لغة المحادثة</label>
<select id="language">
<option value="ar">العربية</option>
<option value="en">English</option>
</select>

<button id="start">الدخول كزائر</button>
<div id="status"></div>
<div class="note">دخولك كزائر لا يحتاج إلى بريد إلكتروني. احفظ رمزك حتى نضيف لاحقًا إمكانية تحويل حسابك إلى حساب دائم.</div>
</section>

<section id="profile">
<h2>أهلاً بك في WASL 🎉</h2>
<p id="welcome"></p>
<p class="note">تم تسجيل دخولك كزائر. الخطوة التالية هي تجهيز نظام المحادثات.</p>
</section>
</main>

<script>
const SUPABASE_URL = "https://xtmiviishvurkvqwgwuv.supabase.co";
const SUPABASE_KEY = "sb_publishable_rkR1e6-p_Mv-WM1tAT6keg_WZUR8fCb";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusBox = document.getElementById("status");
const startButton = document.getElementById("start");

function showStatus(message, error=false){
  statusBox.textContent = message;
  statusBox.style.color = error ? "#fb7185" : "#fbbf24";
}

async function loadProfile(user){
  const {data, error} = await db
    .from("profiles")
    .select("nickname, login_name")
    .eq("id", user.id)
    .maybeSingle();

  if(error) throw error;

  if(data){
    document.getElementById("entry").style.display = "none";
    document.getElementById("profile").style.display = "block";
    document.getElementById("welcome").textContent =
      "مرحباً " + data.nickname + " — رمزك: " + (data.login_name || "");
  }
}

async function enterGuest(){
  startButton.disabled = true;
  showStatus("جاري تجهيز حسابك...");

  try{
    const nickname = document.getElementById("nickname").value.trim();
    const loginName = document.getElementById("loginName").value.trim();
    const language = document.getElementById("language").value;

    if(nickname.length < 2){
      throw new Error("اكتب اسمًا مستعارًا من حرفين على الأقل");
    }

    if(!/^[A-Za-z0-9_.]{4,24}$/.test(loginName)){
      throw new Error("الرمز يجب أن يكون 4 إلى 24 حرفًا أو رقمًا أو نقطة أو شرطة سفلية");
    }

    let {data: sessionData, error: sessionError} =
      await db.auth.getSession();

    if(sessionError) throw sessionError;

    let user = sessionData.session?.user;

    if(!user){
      const {data, error} = await db.auth.signInAnonymously();
      if(error) throw error;
      user = data.user;
    }

    const {data: existing, error: readError} = await db
      .from("profiles")
      .select("id")
      .eq("id", user.id)
      .maybeSingle();

    if(readError) throw readError;

    if(existing){
      throw new Error("لديك حساب زائر محفوظ بالفعل في هذا المتصفح");
    }

    const {error: insertError} = await db
      .from("profiles")
      .insert({
        id: user.id,
        nickname: nickname,
        login_name: loginName,
        language: language,
        is_vip: false
      });

    if(insertError){
      if(insertError.code === "23505"){
        throw new Error("هذا الرمز مستخدم بالفعل، اختر رمزًا آخر");
      }
      throw insertError;
    }

    document.getElementById("entry").style.display = "none";
    document.getElementById("profile").style.display = "block";
    document.getElementById("welcome").textContent =
      "مرحباً " + nickname + " — رمزك: " + loginName;

  }catch(error){
    showStatus(error.message || "حدث خطأ، حاول مرة أخرى", true);
  }finally{
    startButton.disabled = false;
  }
}

startButton.addEventListener("click", enterGuest);

(async function(){
  const {data} = await db.auth.getSession();
  if(data.session?.user){
    try{
      await loadProfile(data.session.user);
    }catch(error){
      showStatus("تعذر تحميل الحساب: " + error.message, true);
    }
  }
})();
</script>
</body>
</html>
